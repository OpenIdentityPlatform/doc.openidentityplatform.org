# Builds the site for a pull request, reports Antora messages and broken links in the job summary,
# and fails on an Antora error or a broken link that is not in the known lists of
# .github/build-baseline: the content has known problems, fixed in the product repositories, which
# would otherwise fail every pull request (#25). Link anchors are checked too (#36), and so are the
# head meta tags of every page and the Sitemap line of robots.txt (#37).
name: Build
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
    - name: Install Antora
      run: npm ci
    - name: Generate Site
      id: site
      run: |
        mkdir -p build
        # Antora appends to an existing log file
        rm -f build/antora.log
        npx antora antora-playbook.yml --log-format=json --log-file=build/antora.log
        npm run copyApiDocs
    - name: Report Antora messages
      # also when Antora fails: with --log-file its fatal error goes only to the log
      if: ${{ !cancelled() && hashFiles('build/antora.log') != '' }}
      run: |
        log=build/antora.log
        # annotate the errors on the pull request
        jq -r --arg ws "$GITHUB_WORKSPACE/" 'select(.level == "error" or .level == "fatal")
          | "::warning file=\(.file.path // "" | ltrimstr($ws)),line=\(.file.line // 1),title=Antora \(.level)::\(.msg | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A"))"' "$log"
        {
          echo "## Antora"
          echo
          echo "| Level | Messages |"
          echo "|---|---|"
          jq -rs 'group_by(.level)[] | "| \(.[0].level) | \(length) |"' "$log"
          echo
          echo "### Errors and warnings"
          echo
          echo "Without \`skipping reference to missing attribute\`, which are counted below."
          echo
          echo "| Level | Message | File | Line |"
          echo "|---|---|---|---|"
          jq -r --arg ws "$GITHUB_WORKSPACE/" 'select(.level != "info" and .level != "debug")
            | select(.msg | startswith("skipping reference to missing attribute") | not)
            | "| \(.level) | \(.msg | gsub("\\|"; "\\\\|") | gsub("\r?\n|\r"; "<br>")) | \(.file.path // "" | ltrimstr($ws)) | \(.file.line // "") |"' "$log"
          echo
          echo "### Missing attribute references"
          echo
          echo "| File | Count |"
          echo "|---|---|"
          jq -rs --arg ws "$GITHUB_WORKSPACE/" 'map(select(.msg | startswith("skipping reference to missing attribute")))
            | group_by(.file.path)[] | "| \(.[0].file.path // "" | ltrimstr($ws)) | \(length) |"' "$log"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Check links
      run: |
        rc=0
        docker run --rm -v "$PWD/build/site:/site:ro" lycheeverse/lychee:0.24.2 \
          --offline --no-progress --format json --include-fragments \
          --root-dir /site --fallback-extensions html --index-files index.html \
          --exclude-path '/site/(openam|opendj|openidm|openig)/apidocs' \
          --exclude-path '/site/(openicf|commons)' \
          '/site/**/*.html' > build/lychee.json || rc=$?
        # 2 means broken links were found; anything else non-zero is a failure of the check itself
        if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
          exit "$rc"
        fi
        # without the links to the id of their target page itself, see broken-links.jq; lychee reports
        # a link once per occurrence on the page, check.sh and this list count it once
        all=$(jq -r -f .github/build-baseline/broken-links.jq build/lychee.json)
        broken=$(printf '%s\n' "$all" | LC_ALL=C sort -u)
        {
          echo "## Links"
          echo
          jq -r --argjson n "$(printf '%s' "$broken" | grep -c . || true)" \
            --argjson all "$(printf '%s' "$all" | grep -c . || true)" \
            '"\(.total) checked, \($n) broken (\(.errors - $all) more point to the top of their target page)."' build/lychee.json
          echo
          echo "| Page | Link |"
          echo "|---|---|"
          printf '%s\n' "$broken" | awk -F'\t' 'NF { print "| " $1 " | " $2 " |" }'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Self-test the baseline check
      run: |
        # check.sh must fail on a new Antora error and a new broken link, and pass once they are known.
        # Its output is quoted with "> " on failure: the runner reads workflow commands on stderr too,
        # and its ::error lines would become annotations of the pull request.
        t=$(mktemp -d)
        mkdir -p "$t/.github/build-baseline" "$t/build"
        cp .github/build-baseline/check.sh .github/build-baseline/broken-links.jq "$t/.github/build-baseline/"
        : > "$t/.github/build-baseline/antora-errors.txt"
        : > "$t/.github/build-baseline/broken-links.txt"
        echo '{"level":"error","msg":"self-test","file":{"path":"'"$t"'/x.adoc"}}' > "$t/build/antora.log"
        echo '{"error_map":{"/site/p.html":[{"url":"file:///site/q"}]}}' > "$t/build/lychee.json"
        out=$(GITHUB_STEP_SUMMARY=/dev/null "$t/.github/build-baseline/check.sh" 2> /dev/null) && rc=0 || rc=$?
        if [ "$rc" -ne 1 ] \
          || ! grep -qxF '::error title=New Antora errors::x.adoc — self-test' <<< "$out" \
          || ! grep -qxF '::error title=New broken links::p.html — q' <<< "$out"; then
          echo "check.sh did not report the new Antora error and the new broken link (exit $rc); its output:" >&2
          sed 's/^/> /' <<< "$out" >&2
          exit 1
        fi
        printf 'x.adoc\tself-test\n' > "$t/.github/build-baseline/antora-errors.txt"
        printf 'p.html\tq\n' > "$t/.github/build-baseline/broken-links.txt"
        GITHUB_STEP_SUMMARY=/dev/null "$t/.github/build-baseline/check.sh" > /dev/null
        # a known entry that is gone is reported once, as a notice, and does not fail the check
        printf 'x.adoc\tself-test\ny.adoc\tgone\n' > "$t/.github/build-baseline/antora-errors.txt"
        out=$(GITHUB_STEP_SUMMARY=/dev/null "$t/.github/build-baseline/check.sh" 2> /dev/null) && rc=0 || rc=$?
        if [ "$rc" -ne 0 ] \
          || [ "$out" != '::notice title=No longer found; remove from .github/build-baseline/antora-errors.txt::y.adoc — gone' ]; then
          echo "check.sh did not report only the stale known error (exit $rc); its output:" >&2
          sed 's/^/> /' <<< "$out" >&2
          exit 1
        fi
        # % and CR are escaped in the annotation text, of a new entry and of a stale one
        echo '{"level":"error","msg":"50%\r","file":{"path":"'"$t"'/c.adoc"}}' > "$t/build/antora.log"
        printf 'y.adoc\tgone 50%%\r\n' > "$t/.github/build-baseline/antora-errors.txt"
        out=$(GITHUB_STEP_SUMMARY=/dev/null "$t/.github/build-baseline/check.sh" 2> /dev/null) && rc=0 || rc=$?
        if [ "$rc" -ne 1 ] \
          || ! grep -qxF '::error title=New Antora errors::c.adoc — 50%25%0D' <<< "$out" \
          || ! grep -qxF '::notice title=No longer found; remove from .github/build-baseline/antora-errors.txt::y.adoc — gone 50%25%0D' <<< "$out"; then
          echo "check.sh did not escape % and CR in the annotation text (exit $rc); its output:" >&2
          sed 's/^/> /' <<< "$out" >&2
          exit 1
        fi
        # a link to the top of its target page is not broken; a broken anchor is, and so is a missing
        # page linked at its own id
        : > "$t/build/antora.log"
        : > "$t/.github/build-baseline/antora-errors.txt"
        : > "$t/.github/build-baseline/broken-links.txt"
        lychee_error() {
          echo '{"error_map":{"/site/a.html":[{"url":"file:///site/'"$1"'","status":{"text":"'"$2"'"}}]}}' \
            > "$t/build/lychee.json"
        }
        lychee_error 'd/b.html#b' 'Cannot find fragment'
        if ! GITHUB_STEP_SUMMARY=/dev/null "$t/.github/build-baseline/check.sh" > /dev/null; then
          echo "check.sh failed on a link to the top of its target page" >&2
          exit 1
        fi
        for e in 'd/b.html#c:Cannot find fragment' 'd/b.html#b:Cannot find file'; do
          lychee_error "${e%%:*}" "${e#*:}"
          out=$(GITHUB_STEP_SUMMARY=/dev/null "$t/.github/build-baseline/check.sh" 2> /dev/null) && rc=0 || rc=$?
          if [ "$rc" -ne 1 ] || ! grep -qxF "::error title=New broken links::a.html — ${e%%:*}" <<< "$out"; then
            echo "check.sh did not report the broken link ${e%%:*}, ${e#*:} (exit $rc); its output:" >&2
            sed 's/^/> /' <<< "$out" >&2
            exit 1
          fi
        done
    - name: Self-test the head meta check
      run: |
        # head-meta.sh must report a missing tag, a doubled tag, a robots.txt without the Sitemap line
        # and a missing sitemap.xml; it skips a redirect page, but not a page that quotes one. Its output
        # is quoted on failure, as in the step above.
        t=$(mktemp -d)
        : > "$t/robots.txt"
        printf '%s\n' '<meta http-equiv="refresh" content="0; url=a.html">' > "$t/r.html"
        printf '%s\n' '<meta name="description" content="a">' '<meta property="og:title" content="a">' \
          '<meta property="og:description" content="a">' '<meta property="og:url" content="a">' \
          '<meta name="twitter:card" content="a">' '<meta name="twitter:card" content="a">' \
          '<pre>&lt;meta http-equiv="refresh" content="0; url=b.html"&gt;</pre>' > "$t/a.html"
        out=$(GITHUB_STEP_SUMMARY=/dev/null .github/build-baseline/head-meta.sh "$t") && rc=0 || rc=$?
        e='::error title=Head meta tags and robots.txt::'
        if [ "$rc" -ne 1 ] || [ "$(grep -c '^::error' <<< "$out")" -ne 4 ] \
          || ! grep -q "^${e}robots.txt: no line \`Sitemap: " <<< "$out" \
          || ! grep -qxF "${e}sitemap.xml: missing" <<< "$out" \
          || ! grep -qxF "${e}a.html: 0 x \`<meta property=\"og:image\"\`" <<< "$out" \
          || ! grep -qxF "${e}a.html: 2 x \`<meta name=\"twitter:card\"\`" <<< "$out"; then
          echo "head-meta.sh did not report the problems of the test site (exit $rc); its output:" >&2
          sed 's/^/> /' <<< "$out" >&2
          exit 1
        fi
    - name: Compare with the known problems
      run: .github/build-baseline/check.sh
    - name: Check head meta tags and robots.txt
      # also when the comparison failed, so that one run reports both
      if: ${{ !cancelled() && steps.site.outcome == 'success' }}
      run: .github/build-baseline/head-meta.sh build/site
