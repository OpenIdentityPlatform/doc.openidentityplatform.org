site:
  title: Open Identity Platform Documentation
  start_page: ROOT::index.adoc
  url: https://doc.openidentityplatform.org
  # Antora writes robots verbatim: keep the Sitemap host in sync with site.url above.
  robots: |
    User-agent: *
    Allow: /
    Sitemap: https://doc.openidentityplatform.org/sitemap.xml
  keys:
    google_analytics: 'G-TFFQQ60TMD'
    google_site_verification: 'gB-OZuT18mmNEL-k5UNMHmNWQX5Wv46GnWWs1XZxZeE'
content:
  edit_url: ~
  sources:
  - url: ./
    start_path: ROOT    
  - url: ./
    start_path: opendj
    edit_url: https://github.com/OpenIdentityPlatform/OpenDJ/edit/master/opendj-doc-generated-ref/src/main/asciidoc
  - url: ./
    start_path: openig
    edit_url: https://github.com/OpenIdentityPlatform/OpenIG/edit/master/openig-doc/src/main/asciidoc
  - url: ./
    start_path: openam
    edit_url: https://github.com/OpenIdentityPlatform/OpenAM/edit/master/openam-documentation/openam-doc-source/src/main/asciidoc
  - url: ./
    start_path: openidm
    edit_url: https://github.com/OpenIdentityPlatform/OpenIDM/edit/master/openidm-doc/src/main/asciidoc
  # Older versions: the last release of each previous major line, from the tags the product release
  # workflows put on this repository. One tag per source; lib/versions-from-tags.js reads the tag
  # (fetching it from origin if missing) and turns it into the version: OpenAM-15.2.2 -> 15.2.
  - url: ./
    start_path: opendj
    branches: ~
    tags: OpenDJ-4.10.2
    edit_url: false
  - url: ./
    start_path: openig
    branches: ~
    tags: OpenIG-5.3.2
    edit_url: false
  - url: ./
    start_path: openam
    branches: ~
    tags: OpenAM-15.2.2
    edit_url: false
  - url: ./
    start_path: openidm
    branches: ~
    tags: OpenIDM-6.3.0
    edit_url: false
ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./supplemental-ui

output:
  clean: true

antora:
  extensions:
  - ./lib/versions-from-tags.js
  - ./lib/add-pdf-link.js


asciidoc:
  extensions:
  - ./lib/nested-open-block
  attributes:
    page-toclevels: 1@
    page-pagination: ''

urls: 
  html_extension_style: drop 